<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      font-family: 'Segoe UI';
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      text-align: center;
      color: white;
    }

    .box {
      background: white;
      color: black;
      padding: 30px;
      margin: 100px auto;
      width: 320px;
      border-radius: 15px;
    }

    input, button {
      margin: 10px;
      padding: 10px;
      width: 90%;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #2a5298;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🔐 Login / Signup</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <!-- ✅ SIGNUP -->
  <button onclick="signup()">Signup</button>

  <!-- LOGIN -->
  <button onclick="loginStudent()">Login as Student</button>
  <button onclick="loginCompany()">Login as Company</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
   apiKey: "AIzaSyB2vOec-uC3LsPlpbkMhJBEx4jWQNdd0nk",
  authDomain: "student-job-app-5e62e.firebaseapp.com",
  projectId: "student-job-app-5e62e",
  storageBucket: "student-job-app-5e62e.firebasestorage.app",
  messagingSenderId: "1003108335497",
  appId: "1:1003108335497:web:3abb44acb7b9cc174d2b58",
  measurementId: "G-Y4JEM6R9SC"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ✅ SIGNUP FUNCTION
function signup() {
  const emailVal = document.getElementById("email").value;
  const passVal = document.getElementById("password").value;

  if (!emailVal || !passVal) {
    alert("Fill all fields");
    return;
  }

  auth.createUserWithEmailAndPassword(emailVal, passVal)
    .then(() => {
      alert("✅ Account created successfully");

      // Ask role
      let role = confirm("Click OK for Student, Cancel for Company");

      if (role) {
        window.location = "student.html";
      } else {
        window.location = "company.html";
      }
    })
    .catch(e => alert(e.message));
}

// LOGIN STUDENT
function loginStudent() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .then(() => window.location = "student.html")
    .catch(e => alert(e.message));
}

// LOGIN COMPANY
function loginCompany() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .then(() => window.location = "company.html")
    .catch(e => alert(e.message));
}
</script>

</body>
</html>
